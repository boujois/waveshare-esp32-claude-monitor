; `pio run` builds (and `-t upload` flashes) the Waveshare board; pass `-e lilygo-t-rgb` for the T-RGB
[platformio]
default_envs = waveshare-s3-lcd128

; Waveshare ESP32-S3-LCD-1.28 (ESP32-S3R2, 16MB flash, 2MB PSRAM, GC9A01 240x240 round LCD)

[env:waveshare-s3-lcd128]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags = -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<trgb/>

; upload/monitor ports are auto-detected; set upload_port = /dev/cu.usbmodem... if you have several boards
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

; Waveshare ESP32-S3-Touch-LCD-1.28: the same board with a touch panel, which moves the LCD reset
; and backlight pins. Not the default, so the stock build and releases are unchanged.
;   pio run -e waveshare-s3-touch-lcd128 -t upload
[env:waveshare-s3-touch-lcd128]
extends = env:waveshare-s3-lcd128
build_flags = -DBOARD_HAS_PSRAM -DBOARD_WAVESHARE_TOUCH

; The touch board with a glow strip (WS2812 / SK6812) on GPIO 15 that mirrors the screen: warm white
; when idle, a soft blue pulse while working, an amber pulse when a session needs you, green when done.
; 24 RGBW LEDs (NeoPixel Ring x24), brightness capped at 9/255: a ring at arm's length is bright even
; that low, and dithering (glowmath.h) keeps the fades smooth. Change -DGLOW_LEDS or -DGLOW_MAX below,
; or add -DGLOW_RGB for an RGB strip. Power comes from VSYS.
;   pio run -e waveshare-s3-touch-lcd128-glow -t upload
[env:waveshare-s3-touch-lcd128-glow]
extends = env:waveshare-s3-touch-lcd128
build_flags = ${env:waveshare-s3-touch-lcd128.build_flags} -DGLOW_PIN=15 -DGLOW_LEDS=24 -DGLOW_MAX=9
lib_deps =
    ${env:waveshare-s3-lcd128.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3

; LilyGO T-RGB (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, ST7701S 480x480 round RGB LCD).
; Works with the 2.1" (half/full circle) and 2.8" boards: the panel type is detected from the
; touch controller at start-up. A 2.1" V2 board needs -DTRGB_PANEL=LILYGO_T_RGB_2_1_INCHES_FULL_CIRCLE_V2
; (or ..._HALF_CIRCLE_V2) added to build_flags. The UI is drawn at 240x240 and scaled up 2x.
;   pio run -e lilygo-t-rgb -t upload
[env:lilygo-t-rgb]
platform = espressif32@6.13.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<taps.cpp>   ; no motion sensor: taps come from the touch screen
build_flags =
    -DBOARD_LILYGO_T_RGB
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    lewisxhe/SensorLib@0.2.3

; Unit tests for the hardware-free code (test/), run on the Mac:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -Isrc
