# Builds the firmware and Mac installer, attaches them to a GitHub release,
# and publishes the browser installer page to GitHub Pages.
#
# Release: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# Pull requests: build only, as a check (nothing is published)
# Manual run (Actions tab > Release > Run workflow): build + republish the installer page
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # macOS for Swift: the Mac package includes the menu bar app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # OS and CPU in the key, so toolchains built for another platform are never restored
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('claude-status/firmware/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool<5"

      - name: Build release files
        run: tools/build-release.sh "${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/Claude-Monitor-Mac.zip dist/claude-monitor-firmware.bin dist/claude-monitor-app.bin \
            dist/claude-monitor-firmware-waveshare-s3-touch-lcd128.bin dist/claude-monitor-app-waveshare-s3-touch-lcd128.bin \
            dist/claude-monitor-firmware-lilygo-t-rgb.bin dist/claude-monitor-app-lilygo-t-rgb.bin \
            --title "Claude Monitor ${{ github.ref_name }}" \
            --notes-file - <<'EOF'
          ## Install

          1. **Plug the display into your Mac**, open Terminal, paste this line and press Return: `/bin/bash -c "$(curl -fsSL https://boujois.github.io/waveshare-esp32-claude-monitor/install.sh)"`. It puts the software on the display over USB, tells you when to connect the display to your Wi-Fi from your phone (join `Claude-Monitor-Setup`), and sets up your Mac.
          2. **Options:** click the Claude Monitor icon in the menu bar (a small circle inside a circle, near the clock). **Plan usage → Connect** shows your 5-hour and weekly limits on the display, and **Night mode** darkens it overnight. The menu bar app needs macOS 13 or later.

          **Rather not use Terminal?** Download **Claude-Monitor-Mac.zip** below, plug in the display and double-click **Install.command**. macOS stops it the first time, so click **Done**, then **System Settings → Privacy & Security → Open Anyway**. Or put the software on the display from the [browser installer](https://boujois.github.io/waveshare-esp32-claude-monitor/) in Chrome or Edge.

          **Already installed?** Click **Update** in the menu bar app, run the Terminal line above again, or ask Claude Code to *"update my Claude monitor"*. From v1.1.0 on, the display updates over Wi-Fi.

          **Works with three displays:** the Waveshare ESP32-S3-LCD-1.28, its touch version (ESP32-S3-Touch-LCD-1.28) and the LilyGO T-RGB (2.1" or 2.8"). The installers and Wi-Fi updates put the right software on yours.

          If the installer page doesn't open, flash the image for your display with [Espressif's web flasher](https://espressif.github.io/esptool-js/) at address `0x0`: `claude-monitor-firmware.bin` for the Waveshare, `claude-monitor-firmware-waveshare-s3-touch-lcd128.bin` for its touch version, `claude-monitor-firmware-lilygo-t-rgb.bin` for the LilyGO T-RGB. The `claude-monitor-app…bin` files are the app-only images used for Wi-Fi updates.
          EOF

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/web

  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages may not be available (e.g. private repo on a free plan); don't fail the release over it
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
